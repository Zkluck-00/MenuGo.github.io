<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MenuGo | Seguimiento para llevar</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-[#f7f3ec] text-slate-900">
  <main class="mx-auto w-full max-w-5xl px-4 py-6">
    <header class="mb-6 rounded-[28px] bg-gradient-to-br from-slate-950 to-orange-600 p-6 shadow-xl shadow-orange-900/20">
      <div class="flex flex-col items-center gap-4 text-center md:flex-row md:text-left">
        <img src="../img/Log.png" alt="Logo MenuGo" class="h-20 w-20 rounded-full bg-white object-contain p-2" />
        <div>
          <p class="text-sm font-black uppercase tracking-wide text-white">Pedido para recoger</p>
          <h1 class="mt-1 text-3xl font-black text-white md:text-4xl">Seguimiento del pedido</h1>
          <p class="mt-2 text-white/90">Consulta si tu pedido sigue en cocina o si ya está listo para recoger.</p>
        </div>
      </div>
    </header>

    <section class="rounded-3xl bg-white p-5 shadow-md shadow-slate-900/5">
      <div class="grid grid-cols-1 gap-3 md:grid-cols-[minmax(0,1fr)_auto] md:items-end">
        <label class="block">
          <span class="mb-1 block text-xs font-black uppercase tracking-wide text-slate-500">Código de seguimiento</span>
          <input id="codigo-seguimiento" type="text" placeholder="LLEV-001"
            class="w-full rounded-2xl border border-slate-200 px-4 py-3 text-lg font-black uppercase outline-none focus:ring-2 focus:ring-orange-400">
        </label>
        <button type="button" onclick="consultarSeguimientoManual()"
          class="rounded-2xl bg-orange-500 px-6 py-3 font-black text-white hover:bg-orange-600">
          Consultar
        </button>
      </div>
      <p class="mt-3 text-sm font-semibold text-slate-500">El estado se actualiza automáticamente cada pocos segundos.</p>
    </section>

    <section id="seguimiento-contenido" class="mt-5 rounded-3xl border border-dashed border-slate-300 bg-white p-8 text-center shadow-sm">
      <h2 class="text-2xl font-black text-slate-800">Ingresa tu código para ver el seguimiento</h2>
      <p class="mt-2 text-slate-500">Ejemplo: LLEV-001</p>
    </section>
  </main>

  <script src="../js/config.js"></script>
  <script src="../js/tiempo-real.js"></script>
  <script src="../js/seguimiento-llevar.js"></script>
</body>

</html>
