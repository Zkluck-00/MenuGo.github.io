    <!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MenuGo | Inicio</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="../css/styles.css">
</head>

<body>
    <div class="container min-vh-100 d-flex flex-column justify-content-center align-items-center text-center">

        <!-- Logo -->
        <img src="../img/Log.png" alt="Logo MenuGo" class="mb-4 logo-img">

        <!-- Bienvenida -->
        <h1 class="mb-2">Bienvenido a MenuGo</h1>
        <p class="mb-4">Selecciona cómo deseas consumir tu pedido</p>

        <!-- Botones tipo de consumo -->
        <div class="d-flex flex-column flex-sm-row gap-3">
            <a id="btn-consumir-local" href="#" onclick="limpiarPedido(false)" class="btn btn-primary btn-lg w-100 w-sm-auto">Consumir aquí</a>
            <a id="btn-para-llevar" href="para_llevar.html" onclick="limpiarPedido(true)" class="btn btn-success btn-lg w-100 w-sm-auto">Para
                llevar</a>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/config.js"></script>
    <script>
const API_BASE = window.MENUGO_API || "http://localhost:4000/api";
        const params = new URLSearchParams(window.location.search);
        const mesa = params.get("mesa");
        const token = params.get("token");
        const btnLocal = document.getElementById("btn-consumir-local");
        const btnLlevar = document.getElementById("btn-para-llevar");

        function limpiarPedido(limpiarMesa = false) {
            localStorage.removeItem("pedido");
            localStorage.removeItem("tipoConsumo");
            localStorage.removeItem("nombreCliente");
            localStorage.removeItem("apellidosCliente");

            if (limpiarMesa) {
                localStorage.removeItem("mesa");
                localStorage.removeItem("mesaActual");
                localStorage.removeItem("mesaToken");
            }
        }

        function desactivarPedidoLocal(texto) {
            if (!btnLocal) return;
            btnLocal.removeAttribute("href");
            btnLocal.classList.add("disabled");
            btnLocal.textContent = texto;
            btnLocal.onclick = function (event) {
                event.preventDefault();
                alert("Para consumir en el local debes escanear el QR valido de tu mesa.");
            };
        }

        async function validarQrInicial() {
            limpiarPedido(false);

            if (btnLlevar) btnLlevar.href = "para_llevar.html";

            if (!mesa || !token) {
                desactivarPedidoLocal("Escanea el QR de tu mesa");
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/mesas/validar-qr?mesa=${encodeURIComponent(mesa)}&token=${encodeURIComponent(token)}`);
                const data = await response.json().catch(() => ({}));
                if (!response.ok || data.ok === false) throw new Error(data.message || "QR invalido");

                localStorage.setItem("mesa", mesa);
                localStorage.setItem("mesaActual", mesa);
                localStorage.setItem("mesaToken", token);

                if (btnLocal) {
                    btnLocal.href = `menu.html?tipo=local&mesa=${encodeURIComponent(mesa)}&token=${encodeURIComponent(token)}`;
                    btnLocal.classList.remove("disabled");
                    btnLocal.textContent = "Consumir aquí";
                }
            } catch (error) {
                console.error("QR invalido:", error);
                localStorage.removeItem("mesa");
                localStorage.removeItem("mesaActual");
                localStorage.removeItem("mesaToken");
                desactivarPedidoLocal("QR invalido");
            }
        }

        validarQrInicial();
    </script>
</body>

</html>
