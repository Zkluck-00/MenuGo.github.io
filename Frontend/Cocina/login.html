<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MenuGo | Login Cocina</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-[#f7f3ec] text-slate-900">
  <main class="flex min-h-screen items-center justify-center px-4 py-10">
    <section class="w-full max-w-md rounded-[32px] border border-slate-200 bg-white p-6 shadow-2xl shadow-slate-900/10">
      <div class="mb-6 text-center">
        <img src="../img/Log.png" alt="Logo MenuGo" class="mx-auto h-24 w-24 rounded-full bg-white object-contain p-2 shadow-md" />
        <p class="mt-4 text-sm font-black uppercase tracking-wide text-orange-600">Acceso del personal</p>
        <h1 class="mt-1 text-3xl font-black text-slate-950">Panel de Cocina</h1>
        <p class="mt-2 text-sm font-semibold text-slate-500">Ingresa con las credenciales autorizadas para este rol.</p>
      </div>

      <div id="mensaje-login-personal" class="hidden mb-4 rounded-xl bg-red-100 p-4 text-sm font-semibold text-red-700 border border-red-200"></div>

      <form id="form-login-personal" data-rol="cocina" class="space-y-4">
        <label class="block">
          <span class="mb-1 block text-xs font-black uppercase tracking-wide text-slate-500">Correo</span>
          <input id="login-email" type="email" autocomplete="username" required
            class="w-full rounded-2xl border border-slate-300 bg-white px-4 py-3 text-sm font-bold outline-none focus:border-orange-500"
            placeholder="correo@MenuGo.com" />
        </label>

        <label class="block">
          <span class="mb-1 block text-xs font-black uppercase tracking-wide text-slate-500">Contraseña</span>
          <div class="relative">
            <input id="login-password" type="password" autocomplete="current-password" required
              class="w-full rounded-2xl border border-slate-300 bg-white px-4 py-3 pr-12 text-sm font-bold outline-none focus:border-orange-500"
              placeholder="Ingresa tu contraseña" />
            
            <!-- Botón con icono de ojo -->
            <button type="button" onclick="togglePasswordVisibility()" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 focus:outline-none">
              <!-- Icono Ojo Abierto -->
              <svg id="icono-ojo" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
              </svg>
              <!-- Icono Ojo Tachado (oculto por defecto) -->
              <svg id="icono-ojo-tachado" xmlns="http://www.w3.org/2000/svg" class="hidden h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a10.05 10.05 0 012.355-3.66m3.585-2.222A9.956 9.956 0 0112 5c4.478 0 8.268 2.943 9.542 7a10.027 10.027 0 01-4.132 5.411m0 0L21 21" />
              </svg>
            </button>
          </div>
        </label>

        <button type="submit" class="w-full rounded-2xl bg-orange-500 px-5 py-3 text-sm font-black text-white shadow-lg shadow-orange-500/20 hover:bg-orange-600">
          Iniciar sesión
        </button>
      </form>
      
      <!-- MEJORA: Botón de retorno -->
      <div class="mt-6 text-center">
        <a href="../index.html" class="text-sm font-bold text-slate-400 hover:text-orange-500 transition">← Volver al inicio</a>
      </div>

    </section>
  </main>

  <!-- Script para alternar la visibilidad de la contraseña -->
  <script>
    function togglePasswordVisibility() {
      const passwordInput = document.getElementById('login-password');
      const iconoOjo = document.getElementById('icono-ojo');
      const iconoOjoTachado = document.getElementById('icono-ojo-tachado');

      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        iconoOjo.classList.add('hidden');
        iconoOjoTachado.classList.remove('hidden');
      } else {
        passwordInput.type = 'password';
        iconoOjo.classList.remove('hidden');
        iconoOjoTachado.classList.add('hidden');
      }
    }
  </script>

  <script src="../js/config.js"></script>
  <script src="../js/personal-auth.js"></script>
</body>
</html>
