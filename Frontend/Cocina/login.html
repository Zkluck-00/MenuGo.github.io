<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MenuGo | Login Cocina</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-[#f7f3ec] text-slate-900">
  <main class="flex min-h-screen items-center justify-center px-4 py-10">
    <section class="w-full max-w-md rounded-[32px] border border-slate-200 bg-white p-6 shadow-2xl shadow-slate-900/10">
      <div class="mb-6 text-center">
        <img src="../img/Log.png" alt="Logo MenuGo" class="mx-auto h-24 w-24 rounded-full bg-white object-contain p-2 shadow-md" />
        <p class="mt-4 text-sm font-black uppercase tracking-wide text-orange-600">Acceso del personal</p>
        <h1 class="mt-1 text-3xl font-black text-slate-950">Panel de Cocina</h1>
        <p class="mt-2 text-sm font-semibold text-slate-500">Ingresa con las credenciales autorizadas para este rol.</p>
      </div>

      <div id="mensaje-login-personal" class="hidden"></div>

      <form id="form-login-personal" data-rol="cocina" class="space-y-4">
        <label class="block">
          <span class="mb-1 block text-xs font-black uppercase tracking-wide text-slate-500">Correo</span>
          <input id="login-email" type="email" autocomplete="username" required
            class="w-full rounded-2xl border border-slate-300 bg-white px-4 py-3 text-sm font-bold outline-none focus:border-orange-500"
            placeholder="correo@MenuGo.com" />
        </label>

        <label class="block">
          <span class="mb-1 block text-xs font-black uppercase tracking-wide text-slate-500">Contrasena</span>
          <input id="login-password" type="password" autocomplete="current-password" required
            class="w-full rounded-2xl border border-slate-300 bg-white px-4 py-3 text-sm font-bold outline-none focus:border-orange-500"
            placeholder="Ingresa tu contrasena" />
        </label>

        <button type="submit" class="w-full rounded-2xl bg-orange-500 px-5 py-3 text-sm font-black text-white shadow-lg shadow-orange-500/20 hover:bg-orange-600">
          Iniciar sesion
        </button>
      </form>

    </section>
  </main>

  <script src="../js/config.js"></script>
<script src="../js/personal-auth.js"></script>
</body>
</html>
