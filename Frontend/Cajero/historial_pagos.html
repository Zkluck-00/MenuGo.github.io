<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>MenuGo | Historial de pagos</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-[#f7f3ec] text-slate-900">
    <main class="mx-auto max-w-7xl px-4 py-6">
        <header class="mb-6 rounded-[28px] bg-slate-950 p-6 text-white">
            <div class="flex flex-wrap items-center justify-between gap-3">
                <div>
                    <p class="text-sm font-black uppercase text-orange-400">Cajero</p>
                    <h1 class="text-3xl font-black">Historial de pagos</h1>
                </div><a href="cajero.html" class="rounded-xl bg-white/10 px-4 py-3 font-black">Volver a Caja</a>
            </div>
        </header>
        <section class="rounded-3xl border border-slate-200 bg-white p-4">
            <div class="grid gap-3 md:grid-cols-4"><label><span
                        class="text-xs font-black uppercase text-slate-500">Desde</span><input id="filtro-desde"
                        type="date" class="mt-1 w-full rounded-xl border p-2"></label><label><span
                        class="text-xs font-black uppercase text-slate-500">Hasta</span><input id="filtro-hasta"
                        type="date" class="mt-1 w-full rounded-xl border p-2"></label><label><span
                        class="text-xs font-black uppercase text-slate-500">Metodo</span><select id="filtro-metodo"
                        class="mt-1 w-full rounded-xl border p-2">
                        <option value="">Todos</option>
                        <option>Efectivo</option>
                        <option>Yape</option>
                        <option>Plin</option>
                        <option>Tarjeta credito</option>
                        <option>Tarjeta debito</option>
                    </select></label>
                <div class="flex items-end"><button onclick="cargarHistorialPagos()"
                        class="w-full rounded-xl bg-slate-950 px-4 py-2 font-black text-white">Filtrar</button></div>
            </div>
        </section>
        <section class="mt-5 overflow-hidden rounded-3xl border border-slate-200 bg-white shadow-sm">
            <div class="overflow-x-auto">
                <table class="min-w-full text-left text-sm">
                    <thead class="bg-slate-100 text-xs uppercase text-slate-600">
                        <tr>
                            <th class="p-3">Pago</th>
                            <th class="p-3">Fecha</th>
                            <th class="p-3">Cuenta</th>
                            <th class="p-3">Metodo</th>
                            <th class="p-3">Comprobante</th>
                            <th class="p-3">Cajero</th>
                            <th class="p-3 text-right">Monto</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-pagos"></tbody>
                </table>
            </div>
        </section>
    </main>
    <script src="../js/config.js"></script>
    <script src="../js/personal-auth.js"></script>
    <script src="../js/historial-pagos.js"></script>
</body>

</html>
