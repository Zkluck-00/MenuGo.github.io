<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MenuGo | Caja y Cobros</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-[#f7f3ec] text-slate-900">
  <main class="mx-auto w-full max-w-7xl px-4 py-5 lg:px-6">
    <header class="mb-6 rounded-[28px] bg-gradient-to-br from-slate-950 to-slate-700 px-5 py-6 shadow-xl shadow-slate-900/20 md:px-8">
      <div class="flex flex-col gap-4 lg:flex-row lg:items-center lg:justify-between">
        <div class="flex flex-col items-center gap-4 text-center md:flex-row md:text-left">
          <img src="../img/Log.png" alt="Logo MenuGo" class="h-20 w-20 rounded-full bg-white object-contain p-2 shadow-md" />
          <div>
            <p class="text-sm font-black uppercase tracking-wide text-white">Panel del cajero</p>
            <h1 class="mt-1 text-3xl font-black leading-tight text-white md:text-4xl">Punto de Venta</h1>
            <p class="mt-2 max-w-2xl text-base font-medium text-white/90">
              Cobra cuentas entregadas, registra comprobantes, atiende solicitudes de cuenta y realiza el cierre de caja.
            </p>
          </div>
        </div>
        <nav class="flex flex-wrap justify-center gap-2 lg:justify-end">
          <a href="cajero.html?filtro=listas" class="rounded-2xl bg-white/10 px-4 py-3 text-sm font-black text-white ring-1 ring-white/20 hover:bg-white/20">Cuentas</a>
          <a href="corte_caja.html" class="rounded-2xl bg-white/10 px-4 py-3 text-sm font-black text-white ring-1 ring-white/20 hover:bg-white/20">Corte de caja</a>
          <a href="historial_pagos.html" class="rounded-2xl bg-white/10 px-4 py-3 text-sm font-black text-white ring-1 ring-white/20 hover:bg-white/20">Historial</a>
          <a href="facturacion.html" class="rounded-2xl bg-white/10 px-4 py-3 text-sm font-black text-white ring-1 ring-white/20 hover:bg-white/20">Comprobantes</a>
        </nav>
      </div>
    </header>

    <section class="mb-5 grid grid-cols-2 gap-3 md:grid-cols-5">
      <article class="rounded-3xl border border-slate-200 bg-white p-4 shadow-sm">
        <p class="text-xs font-black uppercase tracking-wide text-slate-500">Cuentas listas</p>
        <p id="stat-pendientes" class="mt-2 text-3xl font-black text-orange-600">0</p>
      </article>
      <article class="rounded-3xl border border-slate-200 bg-white p-4 shadow-sm">
        <p class="text-xs font-black uppercase tracking-wide text-slate-500">Cobros de hoy</p>
        <p id="stat-cobradas" class="mt-2 text-3xl font-black text-emerald-600">0</p>
      </article>
      <article class="rounded-3xl border border-slate-200 bg-white p-4 shadow-sm">
        <p class="text-xs font-black uppercase tracking-wide text-slate-500">Efectivo</p>
        <p id="stat-efectivo" class="mt-2 text-3xl font-black text-blue-600">S/ 0.00</p>
      </article>
      <article class="rounded-3xl border border-slate-200 bg-white p-4 shadow-sm">
        <p class="text-xs font-black uppercase tracking-wide text-slate-500">Digital/Tarjeta</p>
        <p id="stat-tarjeta" class="mt-2 text-3xl font-black text-purple-600">S/ 0.00</p>
      </article>
      <article class="rounded-3xl border border-slate-200 bg-white p-4 shadow-sm">
        <p class="text-xs font-black uppercase tracking-wide text-slate-500">Total cobrado hoy</p>
        <p id="stat-total" class="mt-2 text-3xl font-black text-slate-950">S/ 0.00</p>
      </article>
    </section>

    <section class="mb-5 rounded-3xl border border-slate-200 bg-white p-3 shadow-sm">
      <div class="flex flex-col gap-3 md:flex-row md:items-center md:justify-between">
        <div class="flex flex-wrap gap-2">
          <button type="button" data-filtro="todas" onclick="cambiarFiltroCuentas('todas')" class="filtro-cuenta rounded-full bg-slate-950 px-4 py-2 text-sm font-black text-white">Todas</button>
          <button type="button" data-filtro="listas" onclick="cambiarFiltroCuentas('listas')" class="filtro-cuenta rounded-full border border-slate-200 bg-white px-4 py-2 text-sm font-bold text-slate-700 hover:bg-slate-100">Listas para cobrar</button>
          <button type="button" data-filtro="solicitadas" onclick="cambiarFiltroCuentas('solicitadas')" class="filtro-cuenta rounded-full border border-slate-200 bg-white px-4 py-2 text-sm font-bold text-slate-700 hover:bg-slate-100">Solicitaron cuenta</button>
          <button type="button" data-filtro="llevar" onclick="cambiarFiltroCuentas('llevar')" class="filtro-cuenta rounded-full border border-slate-200 bg-white px-4 py-2 text-sm font-bold text-slate-700 hover:bg-slate-100">Para llevar</button>
          <button type="button" data-filtro="cobradas" onclick="cambiarFiltroCuentas('cobradas')" class="filtro-cuenta rounded-full border border-slate-200 bg-white px-4 py-2 text-sm font-bold text-slate-700 hover:bg-slate-100">Cobros recientes</button>
        </div>
        <button type="button" onclick="recargarCaja()" class="rounded-full border border-emerald-200 bg-emerald-50 px-4 py-2 text-sm font-black text-emerald-700 hover:bg-emerald-100">Actualizar</button>
      </div>
    </section>

    <section id="alertas-pagos-pendientes" class="mb-5 hidden rounded-3xl border border-orange-200 bg-orange-50 p-4 shadow-sm"></section>
    <section id="notificaciones-caja" class="mb-5 hidden rounded-3xl border border-emerald-200 bg-emerald-50 p-4 shadow-sm"></section>
    <section id="contenedor-cuentas" class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3"></section>
  </main>

  <section id="panel-cobro" class="fixed inset-0 z-[60] hidden overflow-y-auto bg-slate-950/70 p-4 backdrop-blur-sm">
    <div class="mx-auto my-4 w-full max-w-5xl rounded-[28px] bg-white shadow-2xl shadow-slate-950/30">
      <div id="contenido-cobro"></div>
    </div>
  </section>

  <script src="../js/config.js"></script>
  <script src="../js/tiempo-real.js"></script>
  <script src="../js/personal-auth.js"></script>
  <script src="../js/caja.js"></script>
</body>
</html>
